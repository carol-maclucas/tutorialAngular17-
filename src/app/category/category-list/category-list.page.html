<div class="container">
    <h1>Listado de Categorías</h1>

    <mat-table [dataSource]="dataSource"> <!-- creamos la tabla-->
        <ng-container matColumnDef="id"> <!--  definiimos la columna1 id-->
            <mat-header-cell *matHeaderCellDef> Identificador </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.id}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="name"> <!-- definimos la columna2 categoria-->
            <mat-header-cell *matHeaderCellDef> Nombre categoría  </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="action"> <!-- definimos la columna3 action-->
            <mat-header-cell *matHeaderCellDef> <!--(Columna acciones sin nombre)--></mat-header-cell>
            <mat-cell *matCellDef="let element"> <!--  se ponen en paralelo verticalmente-->
                <button mat-icon-button style="color:rgb(10, 90, 155)" (click)="editCategory(element)"><mat-icon>edit</mat-icon></button>
                <button mat-icon-button style="color:rgb(209, 28, 28)" (click)="deleteCategory(element)"><mat-icon>clear</mat-icon></button>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row> // definimos la fila de cabecera
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row> // definimos la fila de datos
    </mat-table>

    <div class="buttons">
        <!-- Conectamos el botón con la función createCategory -->
        <button mat-flat-button color="primary" (click)="createCategory()">Nueva categoría</button>
    </div>   
</div>
